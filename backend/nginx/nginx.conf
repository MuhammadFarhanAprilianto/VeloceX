events {
    worker_connections 2048;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # DDoS Shield: Rate Limiting Zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Gzip Compression for Ultra-Fast Loads
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    upstream velocex_backend {
        server backend:8080;
    }

    server {
        listen 80;
        server_name api.velocex.io app.velocex.io localhost;

        # Redirect HTTP to HTTPS in live environment
        # return 301 https://$host$request_uri;

        location / {
            proxy_pass http://velocex_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Apply Rate Limiting
            limit_req zone=api_limit burst=50 nodelay;
            limit_conn conn_limit 50;
        }

        # Dedicated High-Throughput WebSocket Stream
        location /ws {
            proxy_pass http://velocex_backend/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
